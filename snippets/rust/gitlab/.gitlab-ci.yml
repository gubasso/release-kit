# The release automation and the crates.io trusted publisher for GitLab CI. # RK_IF_REGISTRY
# RK_IF_NO_REGISTRY # The release automation for GitLab CI, for a crate that publishes to no registry.
#
# Both jobs run on every push to the trunk, and to a RK_LINE_PREFIX* line when a
# project keeps older lines. release-plz maintains the one release merge
# request against the pushed branch, and merging it is the release: the bump
# push is what makes the release job tag the commit, create the GitLab
# release, and publish to crates.io over OIDC. Only the bot's own bump
# releases, which release_always = false recognizes by its release-plz-*
# source branch. A third job, release-candidate, runs only by hand on a
# pipeline of a line, and mints or promotes that line's release candidate.
#
# Every job authenticates with RELEASE_BOT_TOKEN, the project access token
# the setup stores as a masked CI variable: a push made with the default CI
# job token starts no pipeline, which would silently skip the release half,
# and a merge armed under it would land a bump that releases nothing.
# Trusted publishing covers GitLab.com only; a self-hosted instance cannot
# take the OIDC path and falls back to a token, which the method's
# invariants exist to remove.

include:
  - local: RK_GITLAB_GATE_FRAGMENT
  # The opt-in code scanning job, included only where the landing wrote
  # it: a local include naming an absent file fails the whole pipeline,
  # and a target that did not opt in has no such file.
  - local: .gitlab/ci/code-scanning-semgrep.yml
    rules:
      - exists:
          - .gitlab/ci/code-scanning-semgrep.yml

stages:
  - release
  - test

# Merge request pipelines run the title gate; branch pipelines on the trunk
# and the release lines run the release jobs, whose own rules never match a
# merge request event.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PROJECT_ROOT_NAMESPACE == "OWNER" && ($CI_COMMIT_BRANCH == "RK_TRUNK_BRANCH" || $CI_COMMIT_BRANCH =~ /^RK_LINE_PREFIX_RE/)'

# The project's own jobs, in a pipeline of their own. This forge
# reverse-deep-merges an include, so a file the project owns would
# contribute every key the jobs above leave out, whatever the include order;
# a child pipeline is the only shape that isolates. Declare jobs in
# .gitlab/ci/project.yml and they run here, with their own stages and their
# own nested includes, reaching nothing this file declares. strategy: mirror
# carries the child's status into this pipeline, so a failing project job
# blocks the merge; it needs GitLab 18.2 or newer, which is this
# convention's minimum version. The exists: guard keeps this job out of the
# pipeline altogether while the file is absent, so no empty downstream
# pipeline appears. A job in that file needs no merge_request_event rule:
# this rule already scopes it, and inside a child pipeline
# CI_PIPELINE_SOURCE reads parent_pipeline; use CI_MERGE_REQUEST_ID where a
# rule is wanted. The forge document carries the rest.
project-jobs:
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      exists:
        - .gitlab/ci/project.yml
  trigger:
    include:
      - local: .gitlab/ci/project.yml
    strategy: mirror

.release-plz:
  stage: release
# RK_DEV_ENV_IMAGE_BEGIN
  image: rust:1
# RK_DEV_ENV_IMAGE_END
  variables:
    GIT_DEPTH: "0"
# RK_DEV_ENV_SCRIPT_BEGIN
  before_script:
    - curl -fsSL "https://github.com/release-plz/release-plz/releases/download/release-plz-v0.4.3/release-plz-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C /usr/local/bin
# RK_DEV_ENV_SCRIPT_END

# The release request: the version bump and the changelog, as one merge
# request against the pushed branch. Force-push refresh is unavailable on
# this forge, so release-plz closes an outdated request and opens a fresh one
# when new work lands; the changelog correction window is correspondingly
# narrower.
release-request:
  extends: .release-plz
  rules:
    - if: '$CI_COMMIT_BRANCH == "RK_TRUNK_BRANCH" || $CI_COMMIT_BRANCH =~ /^RK_LINE_PREFIX_RE/'
  # One group per branch: a line's request never waits on another line's.
  resource_group: release-request-$CI_COMMIT_REF_SLUG
  variables:
    RELEASE_STYLE: RK_STYLE
  script:
    - |
      set -eu
      # A line that carries a candidate's version keeps this job out of the
      # candidate numbering: release-plz would propose the next rc in a
      # request. The request returns once the promotion writes the stable
      # version. Cargo reads the current package alone, so any valid
      # manifest form, an inherited workspace version, and any package
      # metadata are handled, and only the leading name and version of its
      # report are read. A version it cannot read fails the job.
      case "$CI_COMMIT_BRANCH" in
        RK_LINE_PREFIX*)
          manifest="$(RK_DEV_RUN cargo read-manifest --offline)"
          version="$(printf '%s' "$manifest" | sed -n 's/^{"name":"[^"]*","version":"\([^"]*\)",.*/\1/p')"
          if [ -z "$version" ]; then
            echo "cargo names no package version for Cargo.toml; no request opens past an unreadable manifest." >&2
            exit 1
          fi
          case "$version" in
            *-*)
              echo "$CI_COMMIT_BRANCH carries the candidate $version; no release request until it is promoted."
              exit 0
              ;;
          esac
          ;;
      esac
    - RK_DEV_RUN release-plz release-pr --forge gitlab --git-token "$RELEASE_BOT_TOKEN"
    - |
      set -eu
      # The trunk style's standing arm. It dies with the request it was made
      # on — this forge refreshes by closing the outdated request and opening
      # a fresh one — so it is re-applied on every run, and it authenticates
      # as the bot for the same reason every job here does: a merge under the
      # job token would land a bump that releases nothing. The bot's own
      # authorship is the filter, so no other open request can be armed by
      # mistake, and an arm the forge cannot take yet — the request's first
      # pipeline not started — waits for the next push rather than failing
      # the job; the lines style merges by hand and arms nothing.
      if [ "$RELEASE_STYLE" != "trunk" ]; then
        echo "the lines style merges each release by hand; not arming."
        exit 0
      fi
      if [ "$CI_COMMIT_BRANCH" != "RK_TRUNK_BRANCH" ]; then
        echo "a line's request is never armed; its candidate is what a human validated."
        exit 0
      fi
      api() { curl -fsS --header "PRIVATE-TOKEN: $RELEASE_BOT_TOKEN" "$@"; }
      project="$CI_API_V4_URL/projects/$CI_PROJECT_ID"
      bot="$(api "$CI_API_V4_URL/user" | grep -o '"username":"[^"]*"' | head -n 1 | cut -d '"' -f 4)"
      iid="$(api "$project/merge_requests?state=opened&target_branch=$CI_COMMIT_BRANCH&author_username=$bot&per_page=1" | grep -o '"iid":[0-9]*' | head -n 1 | cut -d : -f 2)"
      if [ -z "$iid" ]; then
        echo "no release request to arm."
        exit 0
      fi
      if api -X PUT "$project/merge_requests/$iid/merge?auto_merge=true&merge_when_pipeline_succeeds=true&squash=RK_SQUASH_ON_MERGE&should_remove_source_branch=true" >/dev/null 2>&1; then
        echo "armed merge request !$iid."
      else
        echo "could not arm !$iid yet — its pipeline has not started; the next trunk push re-arms."
      fi

# The release itself: tag, GitLab release, and the crates.io publish over # RK_IF_REGISTRY
# OIDC. The job's ID token is exchanged for a short-lived registry token; # RK_IF_REGISTRY
# nothing long-lived exists on the publish path. # RK_IF_REGISTRY
# RK_IF_NO_REGISTRY # The release itself: the tag and the GitLab release. The crate publishes
# RK_IF_NO_REGISTRY # to no registry, so the job reads no registry token.
release:
  extends: .release-plz
  rules:
    - if: '$CI_COMMIT_BRANCH == "RK_TRUNK_BRANCH" || $CI_COMMIT_BRANCH =~ /^RK_LINE_PREFIX_RE/'
  resource_group: release-$CI_COMMIT_REF_SLUG
  id_tokens: # RK_IF_REGISTRY
    CRATES_IO_ID_TOKEN: # RK_IF_REGISTRY
      aud: crates.io # RK_IF_REGISTRY
  script:
    - |
      set -eu
      response="$(curl -fsS -X PUT "https://crates.io/api/v1/trusted_publishing/tokens" \ # RK_IF_REGISTRY
        -H 'Content-Type: application/json' \ # RK_IF_REGISTRY
        -d "{\"jwt\":\"$CRATES_IO_ID_TOKEN\"}")" # RK_IF_REGISTRY
      CARGO_REGISTRY_TOKEN="$(printf '%s' "$response" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')" # RK_IF_REGISTRY
      export CARGO_REGISTRY_TOKEN # RK_IF_REGISTRY
      RK_DEV_RUN release-plz release --forge gitlab --git-token "$RELEASE_BOT_TOKEN"
      curl -fsS -X DELETE "https://crates.io/api/v1/trusted_publishing/tokens" \ # RK_IF_REGISTRY
        -H "Authorization: Bearer $CARGO_REGISTRY_TOKEN" || true # RK_IF_REGISTRY

# A release candidate, minted on purpose. Run this job by hand on a pipeline
# of the line, with the variables LINE, the line's <major>.<minor>, and
# EXPECT, the full SHA of the line's tip you read; PROMOTE=true promotes the
# line's newest candidate instead. rk writes the candidate's version and
# pushes the line as the bot, and that push's pipeline releases nothing:
# no release request carries it. release-plz then releases this commit
# under a config derived from release-plz.toml with release_always = true,
# the one key that releases a commit no request carries. It runs in this
# pipeline because the crates.io publisher binds the top-level pipeline
# file, not a job. The page names the candidate, because a GitLab release
# carries no prerelease badge. A promotion writes the stable version alone,
# and the line's release request proposes it.
release-candidate:
  extends: .release-plz
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^RK_LINE_PREFIX_RE/'
      when: manual
      allow_failure: true
  resource_group: release-candidate-$CI_COMMIT_REF_SLUG
  id_tokens: # RK_IF_REGISTRY
    CRATES_IO_ID_TOKEN: # RK_IF_REGISTRY
      aud: crates.io # RK_IF_REGISTRY
  script:
# RK_DEV_ENV_RK_BEGIN
    - curl --proto '=https' --tlsv1.2 -LsSf "RK_SELF_RELEASES/vRK_SELF_VERSION/release-kit-installer.sh" | RELEASE_KIT_UNMANAGED_INSTALL=/usr/local/bin sh
# RK_DEV_ENV_RK_END
    - |
      set -eu
      if [ "$CI_COMMIT_BRANCH" != "RK_LINE_PREFIX${LINE:-}" ]; then
        echo "this pipeline runs $CI_COMMIT_BRANCH, and LINE names RK_LINE_PREFIX${LINE:-}; run the job on a pipeline of the line it names." >&2
        exit 1
      fi
      git config user.name "release-bot"
      git config user.email "release-bot@invalid"
      git remote set-url origin "https://release-bot:${RELEASE_BOT_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      if [ "${PROMOTE:-false}" = "true" ]; then
        RK_DEV_RUN rk lines mint "$LINE" --promote --expect "${EXPECT:-}" --apply
        exit 0
      fi
      count="$(grep -c '^release_always = false$' release-plz.toml || true)"
      if [ "$count" != "1" ]; then
        echo "release-plz.toml carries 'release_always = false' $count times; the candidate's config flips exactly one." >&2
        exit 1
      fi
      rc_config="$(mktemp)"
      sed 's/^release_always = false$/release_always = true/' release-plz.toml > "$rc_config"
      report="$(RK_DEV_RUN rk lines mint "$LINE" --expect "${EXPECT:-}" --apply --json)"
      printf '%s\n' "$report"
      field() { printf '%s\n' "$report" | sed -n "s/^  \"$1\": \"\([^\"]*\)\",\{0,1\}$/\1/p"; }
      tag="$(field tag)"
      version="$(field version)"
      package="$(field package)"
      response="$(curl -fsS -X PUT "https://crates.io/api/v1/trusted_publishing/tokens" \ # RK_IF_REGISTRY
        -H 'Content-Type: application/json' \ # RK_IF_REGISTRY
        -d "{\"jwt\":\"$CRATES_IO_ID_TOKEN\"}")" # RK_IF_REGISTRY
      CARGO_REGISTRY_TOKEN="$(printf '%s' "$response" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')" # RK_IF_REGISTRY
      export CARGO_REGISTRY_TOKEN # RK_IF_REGISTRY
      RK_DEV_RUN release-plz release --forge gitlab --git-token "$RELEASE_BOT_TOKEN" --config "$rc_config"
      curl -fsS -X DELETE "https://crates.io/api/v1/trusted_publishing/tokens" \ # RK_IF_REGISTRY
        -H "Authorization: Bearer $CARGO_REGISTRY_TOKEN" || true # RK_IF_REGISTRY
      install="cargo install $package --version $version" # RK_IF_REGISTRY
      # RK_IF_NO_REGISTRY install="cargo install --git $CI_PROJECT_URL --tag $tag"
      curl -fsS -X PUT --header "PRIVATE-TOKEN: $RELEASE_BOT_TOKEN" \
        "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases/$tag" \
        --data-urlencode "description=Release candidate $version, for validation before the stable release. It is not the latest stable release. Install it with: $install" >/dev/null
