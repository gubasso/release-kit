# The release automation and the PyPI trusted publisher. This filename is
# registered at PyPI, together with the pypi environment the publish job runs
# in; no other workflow may carry id-token: write.
#
# On develop, release-please maintains the version-bump pull request — it only
# bumps pyproject.toml and writes the changelog, because skip-github-release
# in release-please-config.json keeps it from tagging — and the gate pull
# request is opened once a version is pending. On master, reached only through
# that gate, the release job tags the merge commit, builds the distributions,
# and publishes them over OIDC.
name: release-please

permissions: {}

on:
  push:
    branches: [develop, master]

jobs:
  release-please-pr:
    # TODO(release-kit): set the repository owner
    if: github.repository_owner == 'OWNER' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: release-please-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          target-branch: develop

  # The gate: once the release pull request has merged, develop carries a
  # version no tag names yet, so this cuts release/v<version> at that commit
  # and opens the pull request into master. The head is pinned to one commit,
  # never develop; the guards are explained in the method's operate chapter.
  open-release-gate:
    # TODO(release-kit): set the repository owner
    if: github.repository_owner == 'OWNER' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: open-release-gate
      cancel-in-progress: false
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: open the release gate pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          version="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' pyproject.toml | head -n 1)"
          if [ -z "$version" ]; then
            echo "::error::could not read the version from pyproject.toml."
            exit 1
          fi
          previous="$(git show "$SHA^:pyproject.toml" | sed -n 's/^version *= *"\([^"]*\)".*/\1/p' | head -n 1)"
          if [ "$previous" = "$version" ]; then
            echo "this commit does not bump the version; only the release commit cuts the gate."
            exit 0
          fi
          if [ -n "$(git ls-remote --tags origin "refs/tags/v$version")" ]; then
            echo "v$version is already tagged; no release is pending."
            exit 0
          fi
          ahead="$(gh api "repos/$GH_REPO/compare/master...$SHA" -q '.ahead_by')"
          if [ "$ahead" -eq 0 ]; then
            echo "this commit is not ahead of master; nothing to gate."
            exit 0
          fi
          branch="release/v$version"
          if [ -n "$(git ls-remote --heads origin "refs/heads/$branch")" ]; then
            echo "$branch already exists; leaving it pinned where it is."
          else
            gh api -X POST "repos/$GH_REPO/git/refs" \
              -f "ref=refs/heads/$branch" -f "sha=$SHA" >/dev/null
            echo "cut $branch at $SHA."
          fi
          open="$(gh pr list --base master --head "$branch" --state open --json number -q 'length')"
          if [ "$open" -gt 0 ]; then
            echo "the release gate pull request is already open."
            exit 0
          fi
          gh pr create --base master --head "$branch" \
            --title "release v$version" \
            --body "Gates the release of v$version, pinned to $SHA. Merging tags that commit and publishes; merge it as a merge commit."

  # The publish half. The app token is what lets the tag land under
  # protection; the OIDC token is minted only here, inside the pypi
  # environment the trusted publisher names.
  tag-and-publish:
    # TODO(release-kit): set the repository owner
    if: github.repository_owner == 'OWNER' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: tag the release commit
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          version="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' pyproject.toml | head -n 1)"
          if [ -n "$(git ls-remote --tags origin "refs/tags/v$version")" ]; then
            echo "v$version is already tagged; publishing is idempotent past this point."
            exit 0
          fi
          gh api -X POST "repos/$GH_REPO/git/refs" \
            -f "ref=refs/tags/v$version" -f "sha=$SHA" >/dev/null
          echo "tagged v$version at $SHA."
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: build the distributions
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: publish over OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
