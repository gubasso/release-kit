# The whole release pipeline: there is no registry, so publishing is tagging
# and the tarball attached to the release page is the distribution.
#
# On develop, the release-request job drives git-cliff to maintain the
# version-bump pull request — VERSION plus the changelog — and the gate pull
# request is opened once a version is pending; merging any of that publishes
# nothing. On master, reached only through that gate, the release job tags the
# merge commit, builds the tarball with make dist, and attaches it.
name: release

permissions: {}

on:
  push:
    branches: [develop, master]

jobs:
  # The release request. git-cliff maintains no pull request on its own, so
  # this job computes the bump, rewrites VERSION and the changelog on a
  # request branch, and opens or refreshes the pull request. Force-pushing the
  # branch is the refresh: the request always reflects develop's tip.
  release-request:
    if: github.repository_owner == 'OWNER' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: release-request-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: install git-cliff
        run: pipx install git-cliff==2.13.1
      - name: maintain the release request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -eu
          current="$(cat VERSION)"
          next="$(git cliff --bumped-version | sed 's/^v//')"
          if [ "$next" = "$current" ]; then
            echo "no release-worthy commits since v$current; no request to maintain."
            exit 0
          fi
          if [ -n "$(git ls-remote --tags origin "refs/tags/v$next")" ]; then
            echo "v$next is already tagged; no request to maintain."
            exit 0
          fi
          branch="chore/release-v$next"
          git switch -c "$branch"
          printf '%s\n' "$next" > VERSION
          git cliff --bump -o CHANGELOG.md
          uid="$(gh api "/users/${APP_SLUG}[bot]" -q .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${uid}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add VERSION CHANGELOG.md
          git commit -m "chore(release): v$next"
          git push -f origin "$branch"
          open="$(gh pr list --base develop --head "$branch" --state open --json number -q 'length')"
          if [ "$open" -eq 0 ]; then
            gh pr create --base develop --head "$branch" \
              --title "chore(release): v$next" \
              --body "Bumps VERSION to $next and rewrites the changelog. Merging publishes nothing; the gate pull request that follows is the release."
          fi

  # The gate: once the release request has merged, develop carries a version
  # no tag names yet, so this cuts release/v<version> at that commit and opens
  # the pull request into master. The head is pinned to one commit, never
  # develop; the guards are explained in the method's operate chapter.
  open-release-gate:
    if: github.repository_owner == 'OWNER' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: open-release-gate
      cancel-in-progress: false
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: open the release gate pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          version="$(cat VERSION)"
          previous="$(git show "$SHA^:VERSION" 2>/dev/null || echo "")"
          if [ "$previous" = "$version" ]; then
            echo "this commit does not bump the version; only the release commit cuts the gate."
            exit 0
          fi
          if [ -n "$(git ls-remote --tags origin "refs/tags/v$version")" ]; then
            echo "v$version is already tagged; no release is pending."
            exit 0
          fi
          ahead="$(gh api "repos/$GH_REPO/compare/master...$SHA" -q '.ahead_by')"
          if [ "$ahead" -eq 0 ]; then
            echo "this commit is not ahead of master; nothing to gate."
            exit 0
          fi
          branch="release/v$version"
          if [ -n "$(git ls-remote --heads origin "refs/heads/$branch")" ]; then
            echo "$branch already exists; leaving it pinned where it is."
          else
            gh api -X POST "repos/$GH_REPO/git/refs" \
              -f "ref=refs/heads/$branch" -f "sha=$SHA" >/dev/null
            echo "cut $branch at $SHA."
          fi
          open="$(gh pr list --base master --head "$branch" --state open --json number -q 'length')"
          if [ "$open" -gt 0 ]; then
            echo "the release gate pull request is already open."
            exit 0
          fi
          gh pr create --base master --head "$branch" \
            --title "release v$version" \
            --body "Gates the release of v$version, pinned to $SHA. Merging tags that commit and attaches the tarball; merge it as a merge commit."

  # The release itself: tag the gated merge, build the tarball as a pure
  # function of the tree, and attach it with its checksum.
  tag-and-attach:
    if: github.repository_owner == 'OWNER' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Minting the build-provenance attestation: the OIDC token identifies
      # this run to Sigstore, and the other two write the attestation back.
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: install git-cliff
        run: pipx install git-cliff==2.13.1
      - name: tag and attach
        id: release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          version="$(cat VERSION)"
          previous="$(git show "$SHA^:VERSION" 2>/dev/null || echo "")"
          if [ "$previous" = "$version" ]; then
            echo "this commit does not bump the version; nothing to release."
            exit 0
          fi
          if [ -z "$(git ls-remote --tags origin "refs/tags/v$version")" ]; then
            gh api -X POST "repos/$GH_REPO/git/refs" \
              -f "ref=refs/tags/v$version" -f "sha=$SHA" >/dev/null
            echo "tagged v$version at $SHA."
          fi
          git fetch origin "refs/tags/v$version:refs/tags/v$version"
          make dist
          echo "built=true" >> "$GITHUB_OUTPUT"
          git cliff --latest -o notes.md
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "the release page already exists; leaving it as it is."
            exit 0
          fi
          gh release create "v$version" dist/*.tar.gz dist/*.sha256 \
            --title "v$version" --notes-file notes.md

      # Provenance. The run that built the tarball signs it, so a consumer can
      # check which workflow and commit produced it instead of trusting the
      # release page the checksum also sits on. Attesting by hand is not
      # possible: only the building run holds the identity that signs.
      - uses: actions/attest@v4
        if: steps.release.outputs.built == 'true'
        with:
          subject-path: dist/*.tar.gz
