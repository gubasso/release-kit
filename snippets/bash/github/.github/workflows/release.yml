# The whole release pipeline: there is no registry, so publishing is tagging
# and the tarball attached to the release page is the distribution.
#
# Both release jobs run on every push to the trunk, and to a RK_LINE_PREFIX* line
# when a project keeps older lines. A third job, release-candidate, runs only
# when a person dispatches it for a line, and mints or promotes that line's
# release candidate. Each job calls rk, which holds the release logic
# and reads the driver, the style, and the integration from the landing record.
# release-request runs rk release request, which keeps the one release pull
# request, VERSION plus the changelog, against the pushed branch
# (release-engine:one-request-per-base). Merging that request is the release:
# the release job runs rk release build, which releases only the commit that
# merges the request (release-engine:a-final-version-releases-at-its-request),
# then attests the artifacts, then runs rk release publish, which creates the
# release page and its tag last (release-engine:the-tag-is-created-last).
#
# The attestation stays in this workflow, because only the run that built the
# artifacts holds the identity that signs them. rk cannot mint it.
name: release
# A merge run names itself by the correlation rk release merge waits on;
# every other run keeps the forge's own name.
run-name: ${{ inputs.action == 'merge' && format('rk release merge {0}', inputs.correlation) || '' }}

permissions: {}

on:
  push:
    branches: [RK_TRUNK_BRANCH, 'RK_LINE_PREFIX**']
  # A person dispatches one action on purpose, and nothing watches a push.
  # candidate mints or promotes a line's release candidate: the line, and
  # the tip they read, so a line that moved since then refuses. merge is
  # what rk release merge sends: the trunk's release request, the trunk tip
  # and the head it read, and the correlation the run's name carries.
  workflow_dispatch:
    inputs:
      action:
        description: What this dispatch does, candidate or merge
        required: true
        type: choice
        options: [candidate, merge]
      line:
        description: The release line, <major>.<minor>, as in 1.4 (candidate)
        required: false
        type: string
      expect:
        description: The line's tip you read, as a full commit SHA (candidate)
        required: false
        type: string
      promote:
        description: Promote the line's newest candidate to its stable version instead of minting a new one (candidate)
        required: false
        type: boolean
        default: false
      request:
        description: The release request to merge, by number (merge)
        required: false
        type: string
      base:
        description: The trunk tip the merge expects, as a full commit SHA (merge)
        required: false
        type: string
      head:
        description: The request head the merge expects, as a full commit SHA (merge)
        required: false
        type: string
      correlation:
        description: The id rk release merge finds this run by (merge)
        required: false
        type: string

jobs:
  # The release request. rk opens it on rk-release/<base>, refreshes it in
  # place on every push, and never arms or merges it
  # (release-engine:the-request-never-arms).
  release-request:
    if: github.repository_owner == 'OWNER' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: release-request-${{ github.ref }}
      cancel-in-progress: false
    steps:
      # The mint is scoped, not blanket: without a permission-* input the token
      # carries every permission the installation holds. This half pushes the
      # request branch and opens or refreshes the request, so it takes
      # contents and pull-requests.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        with:
          # client-id takes the client ID or the numeric App ID; GitHub accepts either as the JWT issuer: https://docs.github.com/en/apps/creating-github-apps/authenticating-with-a-github-app/generating-a-json-web-token-jwt-for-a-github-app
          client-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          # zizmor: ignore[artipacked] the persisted credential is the app
          # token rk pushes the request branch with.
          token: ${{ steps.app-token.outputs.token }}
# RK_DEV_ENV_REQUEST_BEGIN
      - name: install rk
        env:
          RK_VERSION: "RK_SELF_VERSION"
        run: |
          set -eu
          curl --proto '=https' --tlsv1.2 -LsSf "RK_SELF_RELEASES/v${RK_VERSION}/release-kit-installer.sh" | RELEASE_KIT_UNMANAGED_INSTALL="$RUNNER_TEMP/rk" sh
          echo "$RUNNER_TEMP/rk" >> "$GITHUB_PATH"
      - name: install git-cliff
        run: pipx install git-cliff==2.14.2
# RK_DEV_ENV_REQUEST_END
      # The request reads the declared files of this commit and of the last
      # release tag from their git trees, and opens only where one changed
      # (release-engine:a-request-follows-the-packed-files). It builds
      # nothing, so it installs no build package.
      # The token is the release app's, never GITHUB_TOKEN: a push made with
      # the default token starts no workflow, and rk refuses it
      # (release-engine:the-request-pushes-as-the-bot).
      - name: maintain the release request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: RK_DEV_RUN rk release request

  # The release itself. rk release build decides from the commit and the
  # forge whether this push releases, and skips every push that does not.
  # Where it releases, it packs the declared files of the commit into the
  # tarball, runs the project's verify command in it, and reports the
  # artifacts. The attestation follows, and only then does rk
  # release publish create the release and its tag, so nothing publicly
  # reachable exists before its attestation does.
  release:
    if: github.repository_owner == 'OWNER' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Minting the build-provenance attestation: the OIDC token identifies
      # this run to Sigstore, and the other two write the attestation back.
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      # This half creates the release, whose publication creates the tag, and
      # reads the pull request the pushed commit merges, because only that
      # merge releases a final version. It opens no pull request, so it takes
      # contents and a read of pull-requests. A target whose tag ruleset
      # blocks creation needs administration here too. The convention's
      # ruleset restricts deletion and update only.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
# RK_DEV_ENV_RELEASE_BEGIN
      - name: install rk
        env:
          RK_VERSION: "RK_SELF_VERSION"
        run: |
          set -eu
          curl --proto '=https' --tlsv1.2 -LsSf "RK_SELF_RELEASES/v${RK_VERSION}/release-kit-installer.sh" | RELEASE_KIT_UNMANAGED_INSTALL="$RUNNER_TEMP/rk" sh
          echo "$RUNNER_TEMP/rk" >> "$GITHUB_PATH"
      - name: install git-cliff
        run: pipx install git-cliff==2.14.2
# RK_DEV_ENV_RELEASE_END
      # The verify command runs with the build packages installed.
      - name: install the build packages
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends RK_BUILD_PACKAGES
      # The build writes its state, release, resume, or skip, and the
      # artifacts it built to the step outputs.
      - name: build
        id: build
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: RK_DEV_RUN rk release build

      # Provenance, minted before anything is publishable. The run that built
      # the artifacts signs them, so a consumer can check which workflow and
      # commit produced them instead of trusting the release page the
      # checksum also sits on. A rerun at the same commit rebuilds the same
      # tarball and attests it again before rk touches the page.
      - name: attest
        if: steps.build.outputs.state == 'release' || steps.build.outputs.state == 'resume'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.build.outputs.artifacts }}

      # The tag is created here and nowhere else: rk creates a draft release,
      # uploads every asset, and publishes the draft, and the publication
      # creates the tag. It skips where the build skipped, finishes a draft a
      # failed run left, and stops on a tag at another commit
      # (release-engine:every-step-converges).
      - name: publish
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: RK_DEV_RUN rk release publish
  # A release candidate, minted on purpose. The job checks out the requested
  # line under the app token and persists it, because rk lines mint reads the
  # line's remote tags and pushes the candidate's version, VERSION,
  # with it. A push made with the default token starts no workflow, and the
  # release job above runs on that push: rk release build releases a
  # candidate at the commit that writes it, and rk release publish creates
  # its prerelease page and its tag (release-engine:a-candidate-is-a-prerelease).
  # So this job publishes nothing and creates no tag. A promotion writes the
  # stable version alone, its push releases nothing, and the line's release
  # request proposes it (release-candidates:a-promotion-writes-only-tested-code).
  release-candidate:
    if: >-
      github.repository_owner == 'OWNER'
      && github.event_name == 'workflow_dispatch'
      && inputs.action == 'candidate'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: release-candidate-${{ inputs.line }}
      cancel-in-progress: false
    steps:
      # A candidate's inputs are optional at the dispatch, because a merge
      # dispatch carries none of them, so the job refuses here first.
      - name: refuse a dispatch without its line and tip
        env:
          LINE: ${{ inputs.line }}
          EXPECT: ${{ inputs.expect }}
        run: |
          set -eu
          if [ -z "$LINE" ] || [ -z "$EXPECT" ]; then
            echo "::error::a candidate dispatch names the line and the tip you read, as -f line=<major>.<minor> -f expect=<sha>; nothing minted."
            exit 1
          fi
      # rk reads the line's tags and pushes one commit, and opens, reads, and
      # tags nothing else, so the token takes contents alone.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: RK_LINE_PREFIX${{ inputs.line }}
          fetch-depth: 0
          # zizmor: ignore[artipacked] the persisted credential is what pushes
          # the candidate's version and reads the line's remote tags below.
          token: ${{ steps.app-token.outputs.token }}
      - name: configure git as the release app
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -eu
          uid="$(gh api "/users/${APP_SLUG}[bot]" -q .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${uid}+${APP_SLUG}[bot]@users.noreply.github.com"
# RK_DEV_ENV_CANDIDATE_BEGIN
      - name: install rk
        env:
          RK_VERSION: "RK_SELF_VERSION"
        run: |
          set -eu
          curl --proto '=https' --tlsv1.2 -LsSf "RK_SELF_RELEASES/v${RK_VERSION}/release-kit-installer.sh" | RELEASE_KIT_UNMANAGED_INSTALL="$RUNNER_TEMP/rk" sh
          echo "$RUNNER_TEMP/rk" >> "$GITHUB_PATH"
# RK_DEV_ENV_CANDIDATE_END
      # A candidate the line already carries with no tag yet is pending: rk
      # reports it, writes and pushes nothing, and exits 0, and a rerun of
      # the release job publishes it
      # (release-candidates:a-pending-candidate-is-published-not-reminted).
      - name: mint
        env:
          LINE: ${{ inputs.line }}
          EXPECT: ${{ inputs.expect }}
          PROMOTE: ${{ inputs.promote }}
        run: |
          set -eu
          if [ "$PROMOTE" = "true" ]; then
            RK_DEV_RUN rk lines mint "$LINE" --promote --expect "$EXPECT" --apply
          else
            RK_DEV_RUN rk lines mint "$LINE" --expect "$EXPECT" --apply
          fi
# RK_MERGE_JOB_BEGIN
# RK_MERGE_JOB_END
