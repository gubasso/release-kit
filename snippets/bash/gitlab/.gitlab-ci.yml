# The whole release pipeline for GitLab CI: there is no registry, so
# publishing is tagging, and the tarball attached to the release page is the
# distribution.
#
# On develop, the release-request job drives git-cliff to maintain the
# version-bump merge request — VERSION plus the changelog — and the gate job
# opens release/v<version> into master once a version is pending; merging any
# of that publishes nothing. On master, reached only through that gate, the
# release job tags the merge commit, builds the tarball with make dist, and
# attaches it to the GitLab release.
#
# Every job authenticates with RELEASE_BOT_TOKEN, the project access token
# the setup stores as a masked CI variable: a push made with the default CI
# job token starts no pipeline, which would silently skip the release half.

stages:
  - release

workflow:
  rules:
    # TODO(release-kit): set the repository owner
    - if: '$CI_PROJECT_ROOT_NAMESPACE == "OWNER" && ($CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "master")'

.tooling:
  stage: release
  image: alpine:3
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apk add --no-cache curl git make tar
    - curl -fsSL "https://github.com/orhun/git-cliff/releases/download/v2.13.1/git-cliff-2.13.1-x86_64-unknown-linux-musl.tar.gz" | tar -xz --strip-components 1 -C /usr/local/bin

# The release request. git-cliff maintains no merge request on its own, so
# this job computes the bump, rewrites VERSION and the changelog on a request
# branch, and opens the merge request when none is open. The branch is
# force-pushed so the request always reflects develop's tip.
release-request:
  extends: .tooling
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
  resource_group: release-request
  script:
    - |
      set -eu
      api() { curl -fsS --header "PRIVATE-TOKEN: $RELEASE_BOT_TOKEN" "$@"; }
      project="$CI_API_V4_URL/projects/$CI_PROJECT_ID"
      current="$(cat VERSION)"
      next="$(git cliff --bumped-version | sed 's/^v//')"
      if [ "$next" = "$current" ]; then
        echo "no release-worthy commits since v$current; no request to maintain."
        exit 0
      fi
      if api "$project/repository/tags/v$next" >/dev/null 2>&1; then
        echo "v$next is already tagged; no request to maintain."
        exit 0
      fi
      branch="chore/release-v$next"
      git switch -c "$branch"
      printf '%s\n' "$next" > VERSION
      git cliff --bump -o CHANGELOG.md
      git config user.name "release-bot"
      git config user.email "release-bot@invalid"
      git add VERSION CHANGELOG.md
      git commit -m "chore(release): v$next"
      git push -f "https://release-bot:${RELEASE_BOT_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:refs/heads/$branch"
      open="$(api "$project/merge_requests?state=opened&source_branch=chore%2Frelease-v$next&target_branch=develop" | grep -c '"iid"' || true)"
      if [ "$open" = "0" ]; then
        api -X POST "$project/merge_requests" \
          --data-urlencode "source_branch=$branch" \
          --data-urlencode "target_branch=develop" \
          --data-urlencode "title=chore(release): v$next" \
          --data-urlencode "description=Bumps VERSION to $next and rewrites the changelog. Merging publishes nothing; the gate merge request that follows is the release." >/dev/null
      fi

# The gate: once the release request has merged, develop carries a version no
# tag names yet, so this cuts release/v<version> at that commit and opens the
# merge request into master. The head is a branch pinned to one commit, never
# develop.
open-release-gate:
  extends: .tooling
  variables:
    GIT_DEPTH: "2"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
  resource_group: open-release-gate
  script:
    - |
      set -eu
      api() { curl -fsS --header "PRIVATE-TOKEN: $RELEASE_BOT_TOKEN" "$@"; }
      project="$CI_API_V4_URL/projects/$CI_PROJECT_ID"
      version="$(cat VERSION)"
      previous="$(git show HEAD^:VERSION 2>/dev/null || echo "")"
      if [ "$previous" = "$version" ]; then
        echo "this commit does not bump the version; only the release commit cuts the gate."
        exit 0
      fi
      if api "$project/repository/tags/v$version" >/dev/null 2>&1; then
        echo "v$version is already tagged; no release is pending."
        exit 0
      fi
      branch="release/v$version"
      if ! api "$project/repository/branches/release%2Fv$version" >/dev/null 2>&1; then
        api -X POST "$project/repository/branches" \
          --data-urlencode "branch=$branch" --data-urlencode "ref=$CI_COMMIT_SHA" >/dev/null
        echo "cut $branch at $CI_COMMIT_SHA."
      fi
      open="$(api "$project/merge_requests?state=opened&source_branch=release%2Fv$version&target_branch=master" | grep -c '"iid"' || true)"
      if [ "$open" != "0" ]; then
        echo "the release gate merge request is already open."
        exit 0
      fi
      api -X POST "$project/merge_requests" \
        --data-urlencode "source_branch=$branch" \
        --data-urlencode "target_branch=master" \
        --data-urlencode "title=release v$version" \
        --data-urlencode "description=Gates the release of v$version, pinned to $CI_COMMIT_SHA. Merging tags that commit and attaches the tarball; merge it as a merge commit." >/dev/null

# The release itself: tag the gated merge, build the tarball as a pure
# function of the tree, upload it to the generic package registry, and create
# the GitLab release pointing at it. This channel offers no provenance
# attestation; the checksum beside the tarball is the whole verification
# surface, and the binding says so rather than implying otherwise.
tag-and-attach:
  extends: .tooling
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
  resource_group: release
  script:
    - |
      set -eu
      api() { curl -fsS --header "PRIVATE-TOKEN: $RELEASE_BOT_TOKEN" "$@"; }
      project="$CI_API_V4_URL/projects/$CI_PROJECT_ID"
      version="$(cat VERSION)"
      previous="$(git show HEAD^:VERSION 2>/dev/null || echo "")"
      if [ "$previous" = "$version" ]; then
        echo "this commit does not bump the version; nothing to release."
        exit 0
      fi
      if ! api "$project/repository/tags/v$version" >/dev/null 2>&1; then
        api -X POST "$project/repository/tags" \
          --data-urlencode "tag_name=v$version" --data-urlencode "ref=$CI_COMMIT_SHA" >/dev/null
        echo "tagged v$version at $CI_COMMIT_SHA."
      fi
      make dist
      tarball="$(ls dist/*.tar.gz | head -n 1)"
      file="$(basename "$tarball")"
      package="$project/packages/generic/release/$version"
      curl -fsS --header "PRIVATE-TOKEN: $RELEASE_BOT_TOKEN" --upload-file "$tarball" "$package/$file" >/dev/null
      curl -fsS --header "PRIVATE-TOKEN: $RELEASE_BOT_TOKEN" --upload-file "$tarball.sha256" "$package/$file.sha256" >/dev/null 2>&1 || true
      if api "$project/releases/v$version" >/dev/null 2>&1; then
        echo "the release page already exists; leaving it as it is."
        exit 0
      fi
      git cliff --latest -o notes.md
      api -X POST "$project/releases" \
        --data-urlencode "tag_name=v$version" \
        --data-urlencode "name=v$version" \
        --data-urlencode "description=$(cat notes.md)" \
        --data-urlencode "assets[links][][name]=$file" \
        --data-urlencode "assets[links][][url]=$package/$file" >/dev/null
      echo "released v$version with $file attached."
