scheme = ["http", "https"]
cache = true
max_retries = 3

# A rate limit is the host declining to answer this checker right now, and
# it says nothing about whether the link works. Treating it as a failure
# makes the gate report the network the check ran from rather than the
# documents it read.
accept = ["100..=103", "200..=299", "429"]

exclude = [
  "https://example.invalid/.*",
  # A snippet template carries a substitution token where the landed file
  # carries the target's project path. The link resolves at the target.
  '^https://github\.com/RK_REPO/',
  # A checked-in target the v0.4.0 binary landed for the fixture identity
  # acme/widget. The project does not exist; the bytes must stay as landed.
  '^https://github\.com/acme/widget/',
  # Owner-only settings pages: 404 to anyone not signed in as the owner.
  '^https://github\.com/[^/]+/[^/]+/settings(/|$)',
  # Bot-gated: reachable in a browser, 401 or 403 to any checker.
  '^https://developers\.redhat\.com/',
  '^https://fastercapital\.com/',
  '^https://jira\.atlassian\.com/',
  '^https://thoughtworks\.medium\.com/',
]
