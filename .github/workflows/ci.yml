name: ci

on:
  push:
    branches: [master, 'release/**']
  pull_request:
    branches: [master, 'release/**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v19
      # No FlakeHub account stands behind this repository, so the cache
      # names its one backend outright instead of probing FlakeHub first
      # and erroring into every run's log.
      - uses: DeterminateSystems/magic-nix-cache-action@v13
        with:
          use-flakehub: false
          use-gha-cache: true
      # sdd is this repository's docs gate and is not in the nix shell. The
      # instance runs gates newer than the last published sdd release, so the
      # pin is the exact source revision this instance was verified against;
      # move it to the release binary once that sdd version ships. nix
      # develop keeps the caller's PATH, so the hook environment finds it.
      - name: install sdd
        run: |
          set -eu
          nix develop --command cargo install spec-driven-docs --locked \
            --git https://github.com/gubasso/spec-driven-docs \
            --rev 438e7541f767461d1a9d1ead8dfbbab0cbb0c78f \
            --root "$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # CI sweeps a detached checkout and commits nothing, so the two
      # commit-time guards are out of scope here — the skip pair the
      # landed block's comment names for a worktree-mode target; every
      # other hook still runs.
      - run: nix develop --command just check
        env:
          SKIP: no-commit-to-branch,rk-worktree-location

  # Every system the flake advertises is one this job natively builds and
  # smokes; the flake's system list and this matrix grow together. A
  # cross-evaluated check is not the same proof, so each runner checks
  # its own system.
  flake:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v19
      - uses: DeterminateSystems/magic-nix-cache-action@v13
        with:
          use-flakehub: false
          use-gha-cache: true
      - run: nix flake check

  # The release configuration proves itself here, not in release.yml.
  # pr-run-mode is skip, so the generated workflow is tag-only and reports
  # nothing on a request: needs resolves inside one file, so a job there
  # could never be one this gate holds. dist is not in the devshell; it
  # installs at the pin dist-workspace.toml carries, with the installer the
  # generated workflow itself uses, and nix develop keeps the caller's PATH
  # so the flake's cargo and that dist meet.
  dist-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v19
      - uses: DeterminateSystems/magic-nix-cache-action@v13
        with:
          use-flakehub: false
          use-gha-cache: true
      - name: install dist at the configured pin
        run: |
          set -eu
          pin="$(grep -m1 '^cargo-dist-version' dist-workspace.toml | cut -d'"' -f2)"
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/axodotdev/cargo-dist/releases/download/v$pin/cargo-dist-installer.sh" | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "DIST_PIN=$pin" >> "$GITHUB_ENV"
      - name: dist runs at the configured pin
        run: nix develop --command dist --version | grep -Fq "$DIST_PIN"
      - name: the committed workflow is what the pin produces
        run: |
          set -eu
          nix develop --command dist generate
          git diff --exit-code -- .github/workflows/release.yml
      - name: the configuration produces a viable release
        run: nix develop --command dist plan

  # The one status-check context the trunk protection requires. It needs
  # every other job and runs even when one fails: the forge reports a
  # skipped job as success, so the gate must run to fail. It names the job
  # that failed, because the gate's own log is where a red merge is read.
  gate:
    if: always()
    needs: [test, flake, dist-plan]
    runs-on: ubuntu-latest
    steps:
      - name: every job succeeded
        env:
          RESULTS: ${{ toJson(needs) }}
        run: |
          set -eu
          bad="$(printf '%s' "$RESULTS" |
            jq -r 'to_entries[] | select(.value.result != "success") | "\(.key) reported \(.value.result)"')"
          [ -z "$bad" ] || { echo "$bad"; exit 1; }
