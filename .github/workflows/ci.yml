name: ci

# Nothing here writes to the repository: every job reads the checkout and
# reports. The floor is nothing, and the three jobs that check out raise it to
# contents alone, which is the shape release-kit's own snippets teach.
permissions: {}

on:
  push:
    branches: [master, 'release/**']
  pull_request:
    branches: [master, 'release/**']

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The guidance gate reads the last release tag through git describe.
      # The default checkout is one commit deep and carries no tag, so the
      # gate would find nothing to compare against and prove nothing. The
      # full history is this job's alone: dist-plan reads no tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v19
      # No FlakeHub account stands behind this repository, so the cache
      # names its one backend outright instead of probing FlakeHub first
      # and erroring into every run's log.
      - uses: DeterminateSystems/magic-nix-cache-action@v13
        with:
          use-flakehub: false
          use-gha-cache: true
      # sdd is this repository's docs gate and comes from the flake input the
      # devshell carries, so this job installs it nowhere: the shell that runs
      # just check is the shell that has it, and flake.lock is what pins it.
      #
      # This job owns every check this project classifies `both`: the
      # recipe invokes the manual stage, which is the same one line
      # rk integrate runs, so the two sides of the boundary are equal by
      # construction rather than by anyone remembering to add a check
      # twice.
      #
      # rk-worktree-location is the one check classified `local-only`, and
      # this is where that classification is expressed. CI checks out
      # detached in a plain clone, which the guard refuses by design.
      # Under local integration the guard that refuses a trunk commit is
      # not in the block at all, so nothing else is skipped and every
      # other hook still runs.
      - run: nix develop --command just check
        env:
          SKIP: rk-worktree-location

  # The one check this project classifies `ci-only`, at the pull-request
  # boundary. dist is not in the devshell: this job installs it at the pin
  # dist-workspace.toml carries, with the installer the generated workflow
  # itself uses, so a desk that has not run that installer cannot run the
  # proof at all.
  #
  # The release configuration proves itself here, not in release.yml.
  # pr-run-mode is skip, so the generated workflow is tag-only and reports
  # nothing on a request: needs resolves inside one file, so a job there
  # could never be one this gate holds. nix develop keeps the caller's PATH,
  # so the flake's cargo and that dist meet.
  dist-plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v19
      - uses: DeterminateSystems/magic-nix-cache-action@v13
        with:
          use-flakehub: false
          use-gha-cache: true
      - name: install dist at the configured pin
        run: |
          set -euo pipefail
          pin="$(grep -m1 '^cargo-dist-version' dist-workspace.toml | cut -d'"' -f2)"
          [ -n "$pin" ] || { echo "dist-workspace.toml names no cargo-dist-version"; exit 1; }
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/axodotdev/cargo-dist/releases/download/v$pin/cargo-dist-installer.sh" | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "DIST_PIN=$pin" >> "$GITHUB_ENV"
      - name: dist runs at the configured pin
        run: nix develop --command dist --version | grep -Fq "$DIST_PIN"
      # The tracked check comes first: git diff compares the index with the
      # working tree and never shows an untracked path, so a request that
      # deletes the workflow would regenerate it and diff clean.
      - name: the committed workflow is what the pin produces
        run: |
          set -euo pipefail
          git ls-files --error-unmatch -- .github/workflows/release.yml > /dev/null
          nix develop --command dist generate
          git diff --exit-code -- .github/workflows/release.yml
      - name: the configuration produces a viable release
        run: nix develop --command dist plan

  # The one status-check context the trunk protection requires. It needs
  # every other job and runs even when one fails: the forge reports a
  # skipped job as success, so the gate must run to fail. It names the job
  # that failed, because the gate's own log is where a red merge is read.
  gate:
    if: always()
    needs: [test, dist-plan]
    runs-on: ubuntu-latest
    # It reads the other jobs' results and checks out nothing.
    permissions: {}
    steps:
      - name: every job succeeded
        env:
          RESULTS: ${{ toJson(needs) }}
        run: |
          set -eu
          bad="$(printf '%s' "$RESULTS" |
            jq -r 'to_entries[] | select(.value.result != "success") | "\(.key) reported \(.value.result)"')"
          [ -z "$bad" ] || { echo "$bad"; exit 1; }
