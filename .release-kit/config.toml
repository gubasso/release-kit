# The committed answers this project gives release-kit.
# Landing verbs record resolved parameters in .release-kit/manifest.json.
# P: landing parameter. N: free name. F: invariant floor.
# A value below a floor refuses by name; read `rk method invariants`.

schema_version = 2

[project]
repo = "gubasso/release-kit" # P: project path on the forge, nested groups included; absent where the project has no forge

[profile]
technologies = ["rust"] # P: every technology present, zero or many; an omitted key detects from the version files
forge = "github" # P: github or gitlab; empty means the project has no forge, and an omitted key detects from the remote

[profile.release]
mode = "automatic" # P: automatic, external, or none
driver = "rust" # P: the technology that states the version and takes the bot; automatic alone
style = "trunk" # P: trunk or lines; automatic alone
line_prefix = "release/" # P: release-line branch prefix, rendered into the release triggers; automatic alone

[git]
trunk = "master" # P: the one permanent branch, rendered into every artifact naming it
checkout_mode = "linked-worktree" # P: linked-worktree or main-worktree, where a topic branch opens
integration = "local" # P: local or forge, which authority moves an implementation onto the trunk
merge_form = "squash" # P: squash or rebase, how the commits of a branch reach the trunk

[capabilities]
nix_packaging = false # P: opt-in Nix capability
reporting_policy = true # P: the landed vulnerability reporting policy
scorecard = true # P: opt-in OpenSSF Scorecard workflow, github only
code_scanning = "codeql" # P: opt-in code scanning provider: codeql, semgrep, or off
workflow_guards = true # P: opt-in workflow guards: the agent and commit policy lines, the glossary, the workflow hooks, merge-cleanup, and branch-reminder

[security]
advisories = "" # N: project receiving vulnerability reports
contact = "" # P: one line naming who receives a report when the forge channel is unavailable; empty keeps the forge's own wording
response = "best-effort" # P: the acknowledgment window the policy promises: best-effort, 1 day, <n> days, 1 business day, or <n> business days
scope = "" # P: one paragraph naming what the project does not own and where to report it instead; empty renders nothing

[setup]
required_check = "gate" # P: the check the release gate believes, and the check the trunk ruleset requires under forge integration
retired_branches = ["main", "develop"] # N: long-lived branches retired by the trunk
release_lines = false # N: true runs protect-release-lines in a full apply
required_workflow = "ci" # P: the workflow name whose completion wakes the release gate under local integration; GitHub only

[setup.bot]
app_id = "" # N: public App identifier; private credentials stay outside this file

[protection]
trunk_ruleset = "master-protection" # N: trunk ruleset name
tag_ruleset = "release-tags" # N: tag ruleset name
lines_ruleset = "release-lines" # N: release-line ruleset name
title_check = "pr-title" # N: title job context
tag_pattern = "refs/tags/v*" # F: invariant, covers every published version
bypass_actors = ["repository-admin"] # F: invariant, the actors git.integration names
allowed_merge_methods = ["squash"] # F: invariant, exactly the method git.merge_form names: squash or rebase
strict_required_status_checks = true # F: invariant, true
owned_trunk_rules = ["deletion", "non_fast_forward", "pull_request", "required_status_checks"] # F: invariant, the rules git.integration names
required_approving_review_count = 0 # F: floor zero; higher is stricter
dismiss_stale_reviews_on_push = false # F: floor false; true is stricter
require_code_owner_review = false # F: floor false; true is stricter
require_last_push_approval = false # F: floor false; true is stricter

[protection.github]
squash_title_source = "PR_TITLE" # F: invariant under the squash merge form, PR_TITLE
squash_body_source = "PR_BODY" # F: invariant under the squash merge form, PR_BODY

[protection.gitlab]
merge_method = "ff" # F: invariant, linear history
squash_option = "always" # F: invariant, the squash git.merge_form names: always under squash, never under rebase
squash_commit_template = "%{title}" # F: invariant, references title and description
push_access_level = 40 # F: invariant, the level git.integration names
merge_access_level = 40 # F: floor thirty

# How a command runs in this project's development environment. The rust
# release jobs run release-plz and the toolchain through it.
[dev_environment]
run = "nix develop --command"

[[dev_environment.github.setup]]
uses = "DeterminateSystems/nix-installer-action@90bb610b90bf290cad97484ba341453bd1cbefea"
tag = "v19"

[[dev_environment.github.cache]]
uses = "DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39"
tag = "v13"
with = { use-flakehub = false, use-gha-cache = true }

[landing]
accepted_drift = { ".github/workflows/release-plz.yml" = { reason = "the request job's rk release eligible step needs release-kit 0.9.15, and this landing installs 0.9.14, so this file re-lands after that release", sha256 = "dccaabe6fb27c6dcb5001cf955b85997d05cb03e28c9d300b3fd18375d5d4c52" } }
