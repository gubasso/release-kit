default_install_hook_types: [pre-commit, commit-msg, pre-push]
# A hook with no stages: key runs at commit and in the manual sweep that
# `just check` and `rk integrate` run, and never again at push.
default_stages: [pre-commit, manual]

# The node hook runs on the devshell nodejs. Without this line an empty
# pre-commit cache can pick `default`, and nodeenv then fails on a prerelease
# entry of the node index: "invalid literal for int() with base 10: '0-alpha'"
# (2026-11-10).
default_language_version:
  node: system

repos:
# BEGIN release-kit
# The release convention's hooks. Install every stage they run at, with
# the hook runner on PATH, prek or pre-commit, which take the same flags:
# prek install --hook-type pre-commit --hook-type commit-msg --hook-type pre-push
# A CI sweep commits nothing, so a job running the hook runner against a trunk
# checkout sets SKIP=no-commit-to-branch,rk-worktree-location in its environment. Append the id of
# every check this project classifies local-only: the value is a list the
# project owns the tail of.
# rk integrate runs this project's pre-integrate suite as
# `prek run --hook-stage manual --all-files`, or as `pre-commit run` with
# the same arguments where prek is not on PATH. Assign to the manual
# stage every check that must pass before work reaches the trunk, and have
# continuous integration invoke the same stages: a check that runs on one
# side of the boundary alone guards one side alone.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict, --force-scope]
  - repo: local
    hooks:
      - id: rk-message
        name: rk message content
        stages: [commit-msg]
        language: system
        entry: rk message --check
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, master]
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: rk-branch-name
        name: rk branch name
        language: system
        always_run: true
        pass_filenames: false
        entry: sh -c 'branch=$(git symbolic-ref --quiet --short HEAD) || exit 0; [ "$branch" = master ] && exit 0; printf %s "$branch" | grep -Eq "^((build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)/[A-Za-z0-9._/-]+|([0-9]+|[A-Z][A-Z0-9]+-[0-9]+)-[A-Za-z0-9._-]+|release[-/].+)$" && exit 0; echo "branch $branch is neither <type>/<slug> nor <issue-id>-<slug>; gh issue develop <issue> --checkout or its glab counterpart mints the linked form" >&2; exit 1'
      - id: rk-worktree-location
        name: rk worktree location
        language: system
        always_run: true
        pass_filenames: false
        entry: sh -c '[ "$(git rev-parse --git-dir)" = "$(git rev-parse --git-common-dir)" ] || exit 0; branch=$(git symbolic-ref --quiet --short HEAD) || { echo "this project works in worktrees — the main checkout takes no commit, detached included; rk worktree add <branch> seats work in its own worktree" >&2; exit 1; }; [ "$branch" = master ] && exit 0; echo "this project works in worktrees — the main checkout holds the trunk and takes no branch commit; rk worktree add $branch gives this branch its own worktree" >&2; exit 1'
      - id: rk-no-force-push-to-trunk
        name: rk no force push to trunk
        stages: [pre-push]
        language: system
        always_run: true
        pass_filenames: false
        entry: sh -c '[ "$PRE_COMMIT_REMOTE_BRANCH" = refs/heads/master ] || exit 0; tracked=$(git rev-parse --verify --quiet "refs/remotes/$PRE_COMMIT_REMOTE_NAME/master"); for base in "$PRE_COMMIT_FROM_REF" "$tracked"; do case "$base" in "") continue;; *[!0]*) ;; *) continue;; esac; git merge-base --is-ancestor "$base" "$PRE_COMMIT_TO_REF" 2>/dev/null && continue; echo "refusing a force push to master, because $base is not an ancestor of the pushed tip; rebase onto the remote trunk instead of rewriting it" >&2; exit 1; done'
      - id: rk-no-merge-commit-to-trunk
        name: rk no merge commit to trunk
        stages: [pre-push]
        language: system
        always_run: true
        pass_filenames: false
        entry: sh -c '[ "$PRE_COMMIT_REMOTE_BRANCH" = refs/heads/master ] || exit 0; tip=${PRE_COMMIT_TO_REF:-$PRE_COMMIT_LOCAL_BRANCH}; [ -n "$tip" ] || exit 0; case "$PRE_COMMIT_FROM_REF" in ""|*[!0]*) range=${PRE_COMMIT_FROM_REF:+$PRE_COMMIT_FROM_REF..}$tip;; *) range=$tip;; esac; merges=$(git rev-list --merges "$range") || { echo "the commits pushed to master cannot be listed, so the push is refused" >&2; exit 1; }; [ -z "$merges" ] && exit 0; echo "refusing a push that adds a merge commit to master, whose history stays linear; rebase instead" >&2; git log --oneline --no-walk $merges >&2; exit 1'
      - id: rk-no-hand-authored-tag
        name: rk no hand-authored tag
        stages: [pre-push]
        language: system
        always_run: true
        pass_filenames: false
        entry: sh -c 'case "$PRE_COMMIT_REMOTE_BRANCH" in refs/tags/v*) echo "never author a tag; the release automation mints every v* tag" >&2; exit 1;; esac'
      - id: rk-status-check
        name: rk status check
        language: system
        pass_filenames: false
        entry: rk status --check --target .
        files: '^(\.github/workflows/|\.gitlab-ci\.yml$|\.gitlab/ci/|AGENTS\.md$|\.release-kit/|\.pre-commit-config\.yaml$|release-plz\.toml$|dist-workspace\.toml$|release-please-config\.json$|cliff\.toml$|\.release-please-manifest\.json$|VERSION$)'
# END release-kit
# A generated file follows its generator, and no check of this project
# rewrites or judges it (the dev environment rule of nix-secrets,
# home/apps/claude-session/rules/dev-environment.md).
# The generated files and their generators:
#   CHANGELOG.md                         release-plz
#   SECURITY.md, and the workflows code-scanning-codeql.yml, pr-title.yml,
#   release-plz.yml, and scorecard.yml   rk, rendered whole
#   .github/workflows/release.yml        cargo-dist
#   .release-kit/manifest.json and .release-kit/setup-proof.json   rk
#   .spec-driven-docs/manifest.json and _docs/.markdownlint-cli2.jsonc   sdd
#   the specs, the tracking schema, and the templates under _docs/ that
#   sdd ships, which stay equal to its shipped copy   sdd
#   Cargo.lock                           cargo
#   flake.lock, here and in snippets/    nix
# Each tool excludes them in its own configuration: dprint.json,
# .markdownlint-cli2.jsonc, _typos.toml, and .editorconfig-checker.json. The
# fixers below have no configuration, so each takes its own exclude. The
# reading hooks keep them: the YAML, TOML, and JSON parsers, the secret and
# merge-conflict scans, the link check, actionlint, and zizmor.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit, manual]
        args: [--markdown-linebreak-ext=md]
        exclude: '^(CHANGELOG\.md|SECURITY\.md|\.github/workflows/(code-scanning-codeql|pr-title|release-plz|release|scorecard)\.yml|\.release-kit/(manifest|setup-proof)\.json|\.spec-driven-docs/manifest\.json|_docs/\.markdownlint-cli2\.jsonc|_docs/specs/SPEC-(budget-debt|comparison-docs|decision-records|docs-format|docs-foundations|docs-specs|guides|instance|known-issues|spec-to-code|tracking|writing-policy|writing-style)\.md|_docs/specs/SPEC-tracking/tracking\.schema\.json|_docs/(specs|decisions|guides|reference)/TEMPLATE-[a-z-]+\.md)$|(^|/)(Cargo|flake)\.lock$'
      - id: end-of-file-fixer
        stages: [pre-commit, manual]
        exclude: '^(CHANGELOG\.md|SECURITY\.md|\.github/workflows/(code-scanning-codeql|pr-title|release-plz|release|scorecard)\.yml|\.release-kit/(manifest|setup-proof)\.json|\.spec-driven-docs/manifest\.json|_docs/\.markdownlint-cli2\.jsonc|_docs/specs/SPEC-(budget-debt|comparison-docs|decision-records|docs-format|docs-foundations|docs-specs|guides|instance|known-issues|spec-to-code|tracking|writing-policy|writing-style)\.md|_docs/specs/SPEC-tracking/tracking\.schema\.json|_docs/(specs|decisions|guides|reference)/TEMPLATE-[a-z-]+\.md)$|(^|/)(Cargo|flake)\.lock$'
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: '^(CHANGELOG\.md|SECURITY\.md|\.github/workflows/(code-scanning-codeql|pr-title|release-plz|release|scorecard)\.yml|\.release-kit/(manifest|setup-proof)\.json|\.spec-driven-docs/manifest\.json|_docs/\.markdownlint-cli2\.jsonc|_docs/specs/SPEC-(budget-debt|comparison-docs|decision-records|docs-format|docs-foundations|docs-specs|guides|instance|known-issues|spec-to-code|tracking|writing-policy|writing-style)\.md|_docs/specs/SPEC-tracking/tracking\.schema\.json|_docs/(specs|decisions|guides|reference)/TEMPLATE-[a-z-]+\.md)$|(^|/)(Cargo|flake)\.lock$'
      - id: check-added-large-files
        args: ['--maxkb=16384']
        stages: [pre-commit, manual]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: destroyed-symlinks
        stages: [pre-commit, manual]
      - id: check-yaml
      - id: check-toml
      - id: detect-private-key
  - repo: https://github.com/editorconfig-checker/editorconfig-checker
    rev: v3.11.1
    hooks:
      - id: editorconfig-checker
        alias: ec
        args: [-disable-insert-final-newline]
        exclude: '\.md$'
  - repo: local
    hooks:
      # owner: devshell (no-hook-language) upstream dprint publishes no pre-commit hook.
      - id: dprint
        name: dprint check
        # dprint exits 14 rather than passing when it receives only paths its
        # own config excludes, which is what a commit touching just the
        # generated CHANGELOG.md hands it.
        entry: dprint check --allow-no-files
        language: system
        types_or: [markdown, json]
      # owner: devshell (project-environment) cargo fmt is part of the Rust toolchain that the devshell pins.
      - id: cargo-fmt
        name: cargo fmt check
        entry: cargo fmt --check
        language: system
        types: [rust]
        pass_filenames: false
      # owner: devshell (project-environment) cargo clippy is part of the Rust toolchain and builds the crate.
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
      # owner: devshell (project-environment) cargo test runs the test suite of the crate.
      - id: cargo-test
        name: cargo test
        entry: cargo test
        language: system
        files: '^(src/|tests/|build\.rs$|Cargo\.(toml|lock)$|method/|bindings/|snippets/|blocks/|skills/|versions\.toml$|LICENSE)'
        pass_filenames: false
      # The three checks below are scope `both` at moment push: each is too
      # costly for a commit, so it runs at pre-push, and in the manual sweep
      # that `rk integrate` and `just check` run, which CI invokes too.
      # owner: devshell (project-environment) cargo deny is a cargo subcommand that reads the lock file of the crate.
      - id: cargo-deny
        name: cargo deny check
        entry: cargo deny check
        language: system
        always_run: true
        stages: [pre-push, manual]
        pass_filenames: false
      # owner: host (no-hook-language) nix comes from the host and has no hook in a language that pre-commit builds.
      - id: nix-flake-check
        name: nix flake check
        entry: nix flake check
        language: system
        always_run: true
        stages: [pre-push, manual]
        pass_filenames: false
      # The scratch landing round trip, through the recipe that owns it.
      # Never make this entry `just check`: that recipe invokes pre-commit
      # and the hook would re-enter itself.
      # owner: devshell (project-environment) the just recipe builds rk and lands it in a scratch target.
      - id: scratch-landing
        name: scratch landing round trip
        entry: just build
        language: system
        always_run: true
        stages: [pre-push, manual]
        pass_filenames: false
      # The two release proofs of the dist-plan job of ci.yml: the committed
      # release.yml is what the pinned dist generates, and dist plan
      # succeeds. The tracked check comes first, because git diff never
      # shows an untracked path, so a deleted workflow would regenerate and
      # diff clean.
      # owner: devshell (project-environment) dist reads the workspace of the crate and generates its workflow.
      - id: dist-plan
        name: dist release proofs
        entry: sh -c 'set -eu; pin=$(grep -m1 "^cargo-dist-version" dist-workspace.toml | cut -d\" -f2); [ -n "$pin" ] || { echo "dist-workspace.toml names no cargo-dist-version" >&2; exit 1; }; dist --version | grep -Fq "$pin" || { echo "the dist on PATH is not the pinned $pin" >&2; exit 1; }; git ls-files --error-unmatch -- .github/workflows/release.yml > /dev/null; dist generate; git diff --exit-code -- .github/workflows/release.yml; dist plan > /dev/null'
        language: system
        always_run: true
        stages: [pre-push, manual]
        pass_filenames: false
  # zizmor and actionlint take their upstream hooks, which pre-commit builds
  # (python and golang). actionlint runs shellcheck from PATH on the `run:`
  # scripts, so the devshell keeps shellcheck for it.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.29.0
    hooks:
      # The snippets are audited against nothing: --no-config keeps zizmor.yml
      # out of reach, because an ignore there is keyed by base filename alone
      # and would silence the shipped release.yml along with the generated
      # one. Every accepted finding in a snippet is an inline comment in that
      # snippet, which renders into each target and drifts no rendered file.
      - id: zizmor
        alias: zizmor-snippets
        name: zizmor over the snippets
        args: [--no-progress, --offline, --no-config, --min-confidence, medium]
        files: '^snippets/.*/\.github/workflows/.*\.ya?ml$'
      - id: zizmor
        alias: zizmor-own
        name: zizmor over this project's workflows
        args: [--no-progress, --offline, --config, zizmor.yml, --min-confidence, medium]
        files: '^\.github/workflows/.*\.ya?ml$'
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      # actionlint reads release.yml too: .github/actionlint.yaml accepts the
      # five shellcheck relays of cargo-dist's output, which are not this
      # project's to fix. See
      # _docs/reference/known-issues/KI-dist-generates-an-unhardened-workflow.md
      - id: actionlint
        files: '^(\.github|snippets/.*/\.github)/workflows/.*\.ya?ml$'
  - repo: https://github.com/frnmst/md-toc
    rev: 9.0.0
    hooks:
      - id: md-toc
        args: [-p, -c, --skip-lines, '1', github, -l, '3']
        files: '^_docs/specs/SPEC-.*\.md$'
        # The specs sdd ships keep the bytes `sdd spec <name>` prints.
        exclude: '^_docs/specs/SPEC-(budget-debt|comparison-docs|decision-records|docs-format|docs-foundations|docs-specs|guides|instance|known-issues|spec-to-code|tracking|writing-policy|writing-style)\.md$'
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
  - repo: https://github.com/crate-ci/typos
    rev: v1.49.0
    hooks:
      - id: typos
        args: [--force-exclude]
        stages: [pre-commit, manual]
  - repo: https://github.com/sirwart/ripsecrets
    rev: v0.1.11
    hooks:
      - id: ripsecrets
  - repo: https://github.com/lycheeverse/lychee
    rev: lychee-v0.24.2
    hooks:
      # The devshell supplies the lychee binary, so the hook installs none.
      # owner: devshell (no-hook-language) upstream lychee offers only script, docker_image, and system ids.
      - id: lychee-system
        stages: [pre-push]
        types: [markdown]
        args: [--no-progress]
  - repo: local
    hooks:
      # A flake holds no language library: a package belongs to the manifest
      # of its stack, and the devshell keeps the toolchain.
      - id: no-language-library-in-flake
        name: a flake holds no language library
        language: pygrep
        entry: '^(?!\s*#).*(withPackages|python3[0-9]*Packages\.|pythonPackages\.|nodePackages\.|perlPackages\.)'
        files: '(^|/)flake\.nix$|(^|/)nix/.*\.nix$'
        stages: [pre-commit, manual]
  # A flake reference reads the git tree of a checkout, never a path copy of
  # the whole folder into the Nix store. The hook is published by exobrain-tech.
  - repo: https://github.com/gubasso/exobrain-tech
    rev: v1.0.0
    hooks:
      - id: no-path-flake-reference
# BEGIN spec-driven-docs managed
  - repo: local
    hooks:
      - id: spec-driven-docs-verify
        name: verify spec-driven docs instance
        entry: sdd verify
        language: system
        always_run: true
        pass_filenames: false
      - id: adr-cites-a-live-rule
        name: 'decision record citations resolve'
        entry: sdd gate adr-cites-a-live-rule
        language: system
        always_run: true
        pass_filenames: false
      - id: adr-filename-shape
        name: 'decision record filename shape'
        entry: sdd gate adr-filename-shape
        language: system
        files: '^_docs/decisions/[^/]*\.md$'
      - id: adr-word-cap
        name: 'decision record word cap'
        entry: sdd gate adr-word-cap
        language: system
        always_run: true
        pass_filenames: false
      - id: agents-digest-size
        name: 'agent digest size'
        entry: sdd gate agents-digest-size
        language: system
        always_run: true
        pass_filenames: false
      - id: chapter-size-cap
        name: 'chapter and catalog size'
        entry: sdd gate chapter-size-cap
        language: system
        always_run: true
        pass_filenames: false
      - id: comparison-dated-tables
        name: 'comparison tables are dated'
        entry: sdd gate comparison-dated-tables
        language: system
        files: '^(?:.*/)?COMPARISON-[^/]*\.md$'
      - id: comparison-escaped-pipes
        name: 'comparison table pipes are escaped'
        entry: sdd gate comparison-escaped-pipes
        language: system
        files: '^(?:.*/)?COMPARISON-[^/]*\.md$'
      - id: comparison-legend
        name: 'comparison legend'
        entry: sdd gate comparison-legend
        language: system
        files: '^(?:.*/)?COMPARISON-[^/]*\.md$'
      - id: comparison-one-reference-per-cell
        name: 'one reference per comparison cell'
        entry: sdd gate comparison-one-reference-per-cell
        language: system
        files: '^(?:.*/)?COMPARISON-[^/]*\.md$'
      - id: comparison-verdict-word
        name: 'comparison verdict word'
        entry: sdd gate comparison-verdict-word
        language: system
        files: '^(?:.*/)?COMPARISON-[^/]*\.md$'
      - id: gate-message-cites-a-rule
        name: 'gate messages cite a rule'
        entry: sdd gate gate-message-cites-a-rule
        language: system
        always_run: true
        pass_filenames: false
      - id: instance-manifest
        name: 'instance manifest'
        entry: sdd gate instance-manifest
        language: system
        always_run: true
        pass_filenames: false
      - id: ki-bugzilla-report-width
        name: 'Bugzilla report width'
        entry: sdd gate ki-bugzilla-report-width
        language: system
        always_run: true
        pass_filenames: false
      - id: ki-checked-date
        name: 'known issue last-check date'
        entry: sdd gate ki-checked-date
        language: system
        always_run: true
        pass_filenames: false
      - id: ki-filename-shape
        name: 'known issue filename shape'
        entry: sdd gate ki-filename-shape
        language: system
        files: '^_docs/reference/known-issues/[^/]*\.md$'
      - id: ki-filing
        name: 'known issue filing state'
        entry: sdd gate ki-filing
        language: system
        always_run: true
        pass_filenames: false
      - id: ki-mechanism-walkthrough
        name: 'known issue mechanism walkthrough'
        entry: sdd gate ki-mechanism-walkthrough
        language: system
        always_run: true
        pass_filenames: false
      - id: ki-report-body
        name: 'known issue report body'
        entry: sdd gate ki-report-body
        language: system
        always_run: true
        pass_filenames: false
      - id: ki-retire-when
        name: 'known issue retirement condition'
        entry: sdd gate ki-retire-when
        language: system
        always_run: true
        pass_filenames: false
      - id: ki-state
        name: 'known issue state'
        entry: sdd gate ki-state
        language: system
        always_run: true
        pass_filenames: false
      - id: no-personal-path
        name: 'no personal path'
        entry: sdd gate no-personal-path
        language: system
        types: [text]
      - id: no-self-narration
        name: 'documents state the present'
        entry: sdd gate no-self-narration
        language: system
        files: '^_docs/(?:specs|decisions|guides|reference|explanation)/(?:.*/)?[^/]*\.md$'
        types: [markdown]
        exclude: '^_docs/decisions/.*$'
      - id: prose-stays-unwrapped
        name: 'prose lines stay unwrapped'
        entry: sdd gate prose-stays-unwrapped
        language: system
        files: '^_docs/(?:specs|decisions|guides|reference|explanation)/(?:.*/)?[^/]*\.md$'
        types: [markdown]
        exclude: '^(?:.*/)?CHANGELOG\.md$'
      - id: spec-requirement-parts
        name: 'spec requirement parts'
        entry: sdd gate spec-requirement-parts
        language: system
        files: '^_docs/specs/SPEC-[^/]*\.md$'
      - id: spec-rule-id-unique
        name: 'spec rule IDs are unique'
        entry: sdd gate spec-rule-id-unique
        language: system
        always_run: true
        pass_filenames: false
      - id: spec-size-cap
        name: 'spec size cap'
        entry: sdd gate spec-size-cap
        language: system
        always_run: true
        pass_filenames: false
      - id: spec-trailing-section
        name: 'spec trailing section'
        entry: sdd gate spec-trailing-section
        language: system
        files: '^_docs/specs/SPEC-[^/]*\.md$'
      - id: spec-verify-hooks-exist
        name: 'spec hook references exist'
        entry: sdd gate spec-verify-hooks-exist
        language: system
        always_run: true
        pass_filenames: false
      - id: suppression-names-its-case
        name: 'suppressions name a known issue'
        entry: sdd gate suppression-names-its-case
        language: system
        always_run: true
        pass_filenames: false
      - id: tracking-registry
        name: 'tracking registry is valid and current'
        entry: sdd gate tracking-registry
        language: system
        always_run: true
        pass_filenames: false
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2
        additional_dependencies: ['markdownlint-rule-relative-links@5.1.3']
# END spec-driven-docs managed
