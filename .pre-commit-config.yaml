# The hook runner is prek, from the host. This is the oldest prek the
# configuration accepts, and ci.yml installs the same version.
minimum_prek_version: "0.5.7"
default_install_hook_types: [pre-commit, commit-msg, pre-push, pre-merge-commit]
# A hook with no stages: key runs at commit, in the manual sweep that
# `just check` and CI run, and in the pre-merge-commit hook that
# `rk integrate` asks git to run on the staged squash, and never again at
# push.
default_stages: [pre-commit, manual, pre-merge-commit]

# The node hook runs on the devshell nodejs. Without this line an empty
# pre-commit cache can pick `default`, and nodeenv then fails on a prerelease
# entry of the node index: "invalid literal for int() with base 10: '0-alpha'"
# (2026-11-10).
default_language_version:
  node: system

repos:
# BEGIN release-kit
# The release convention's hooks. Install every stage they run at with
# the hook manager this project uses, for example:
# prek install --hook-type pre-commit --hook-type commit-msg --hook-type pre-push --hook-type pre-merge-commit
# A hook that CI cannot run carries groups: [local-only], with its reason
# above it, and a hook that only CI runs carries stages: [manual] and
# groups: [ci-only]. Mark each hook of this project the same way. CI runs
# each stage with its group filter, through the project's environment, and
# no committed file sets SKIP. A group filter with no --stage also runs the
# manual hooks, so each step names its stage:
#   prek run --all-files --stage pre-commit --no-group local-only
#   prek run --all-files --stage pre-push --no-group local-only
#   prek run --all-files --stage manual --group ci-only
# prek refuses a --group that matches no hook, so leave the third step out
# where no hook carries ci-only.
# rk integrate runs this clone's pre-merge-commit hook through git, on the
# change the integration squashes, and refuses where none is installed.
# Tag pre-merge-commit on every check that must pass before work reaches
# the trunk, and add it to default_stages where this file sets them. Have
# continuous integration invoke the same checks: a check that runs on one
# side of the boundary alone guards one side alone. prek runs each nested
# .pre-commit-config.yaml as a project of its own, so a project that runs
# prek lists a directory of fixtures in a root .prekignore.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict, --force-scope]
  - repo: local
    hooks:
      - id: rk-message
        name: rk message content
        stages: [commit-msg]
        language: system
        entry: rk message --check
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # local-only: a CI job on a trunk push checks out the trunk, which
      # this guard refuses.
      - id: no-commit-to-branch
        groups: [local-only]
        args: [--branch, master]
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: rk-branch-name
        name: rk branch name
        language: system
        always_run: true
        pass_filenames: false
        entry: sh -c 'branch=$(git symbolic-ref --quiet --short HEAD) || exit 0; [ "$branch" = master ] && exit 0; printf %s "$branch" | grep -Eq "^((build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)/[A-Za-z0-9._/-]+|([0-9]+|[A-Z][A-Z0-9]+-[0-9]+)-[A-Za-z0-9._-]+|release[-/].+|rk-release/.+)$" && exit 0; echo "branch $branch is neither <type>/<slug> nor <issue-id>-<slug>; gh issue develop <issue> --checkout or its glab counterpart mints the linked form" >&2; exit 1'
      # local-only: a CI job checks out the main worktree, which this guard
      # refuses when the checkout is detached.
      - id: rk-worktree-location
        name: rk worktree location
        groups: [local-only]
        language: system
        always_run: true
        pass_filenames: false
        entry: sh -c '[ "$(git rev-parse --git-dir)" = "$(git rev-parse --git-common-dir)" ] || exit 0; branch=$(git symbolic-ref --quiet --short HEAD) || { echo "this project works in worktrees — the main checkout takes no commit, detached included; rk worktree add <branch> seats work in its own worktree" >&2; exit 1; }; [ "$branch" = master ] && exit 0; echo "this project works in worktrees — the main checkout holds the trunk and takes no branch commit; rk worktree add $branch gives this branch its own worktree" >&2; exit 1'
      - id: rk-no-force-push-to-trunk
        name: rk no force push to trunk
        stages: [pre-push]
        language: system
        always_run: true
        pass_filenames: false
        entry: sh -c '[ "$PRE_COMMIT_REMOTE_BRANCH" = refs/heads/master ] || exit 0; listed=$(git ls-remote "${PRE_COMMIT_REMOTE_URL:-$PRE_COMMIT_REMOTE_NAME}" refs/heads/master) || { echo "the remote master cannot be read, so a push to it is refused" >&2; exit 1; }; remote=${listed%%[[:space:]]*}; tracked=$(git rev-parse --verify --quiet "refs/remotes/$PRE_COMMIT_REMOTE_NAME/master"); for base in "$remote" "$PRE_COMMIT_FROM_REF" "$tracked"; do case "$base" in "") continue;; *[!0]*) ;; *) continue;; esac; git cat-file -e "$base^{commit}" 2>/dev/null || { echo "refusing a force push to master, because the remote holds $base, which this clone has not fetched; fetch, then rebase onto the remote trunk" >&2; exit 1; }; git merge-base --is-ancestor "$base" "$PRE_COMMIT_TO_REF" 2>/dev/null && continue; echo "refusing a force push to master, because $base is not an ancestor of the pushed tip; rebase onto the remote trunk instead of rewriting it" >&2; exit 1; done'
      - id: rk-no-merge-commit-to-trunk
        name: rk no merge commit to trunk
        stages: [pre-push]
        language: system
        always_run: true
        pass_filenames: false
        entry: sh -c '[ "$PRE_COMMIT_REMOTE_BRANCH" = refs/heads/master ] || exit 0; tip=${PRE_COMMIT_TO_REF:-$PRE_COMMIT_LOCAL_BRANCH}; [ -n "$tip" ] || exit 0; case "$PRE_COMMIT_FROM_REF" in ""|*[!0]*) range=${PRE_COMMIT_FROM_REF:+$PRE_COMMIT_FROM_REF..}$tip;; *) range=$tip;; esac; merges=$(git rev-list --merges "$range") || { echo "the commits pushed to master cannot be listed, so the push is refused" >&2; exit 1; }; [ -z "$merges" ] && exit 0; echo "refusing a push that adds a merge commit to master, whose history stays linear; rebase instead" >&2; git log --oneline --no-walk $merges >&2; exit 1'
      - id: rk-no-hand-authored-tag
        name: rk no hand-authored tag
        stages: [pre-push]
        language: system
        always_run: true
        pass_filenames: false
        entry: sh -c 'case "$PRE_COMMIT_REMOTE_BRANCH" in refs/tags/v*) echo "never author a tag; the release automation mints every v* tag" >&2; exit 1;; esac'
      - id: rk-status-check
        name: rk status check
        language: system
        pass_filenames: false
        entry: rk status --check --target .
        files: '^(\.github/workflows/|\.gitlab-ci\.yml$|\.gitlab/ci/|AGENTS\.md$|\.release-kit/|\.pre-commit-config\.yaml$|release-plz\.toml$|dist-workspace\.toml$|cliff\.toml$|VERSION$)'
# END release-kit
# A generated file follows its generator, and no check of this project
# rewrites or judges it (the dev environment rule of nix-secrets,
# home/apps/claude-session/rules/dev-environment.md).
# The generated files and their generators:
#   CHANGELOG.md                         release-plz
#   SECURITY.md, and the workflows code-scanning-codeql.yml, pr-title.yml,
#   release-plz.yml, and scorecard.yml   rk, rendered whole
#   .github/workflows/release.yml        cargo-dist
#   .release-kit/manifest.json and .release-kit/setup-proof.json   rk
#   .claude/skills/ and .agents/skills/, the landed packages only   rk, sdd
#   .spec-driven-docs/manifest.json and _docs/.markdownlint-cli2.jsonc   sdd
#   the specs, the tracking schema, and the templates under _docs/ that
#   sdd ships, which stay equal to its shipped copy   sdd
#   Cargo.lock                           cargo
#   flake.lock, here and in snippets/    nix
# Each tool excludes them in its own configuration: dprint.json,
# .markdownlint-cli2.jsonc, _typos.toml, and .editorconfig-checker.json. The
# fixers below have no configuration, so each takes its own exclude. The
# reading hooks keep them: the YAML, TOML, and JSON parsers, the secret and
# merge-conflict scans, the link check, actionlint, and zizmor.
  # The prek built-ins take the place of pre-commit/pre-commit-hooks: no
  # clone, no environment, and no rev. The arguments of the common set keep
  # the upstream behavior where a built-in judges less by default.
  # project: each hook below that states its stages adds manual, the stage
  # that `just check` and CI sweep (default_stages above).
  - repo: builtin
    hooks:
      # A fixer never runs at push. The argument keeps a Markdown hard break.
      # project: the exclude names every generated file of the list above,
      # which is longer than the pattern of the common set.
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        stages: [pre-commit, manual, pre-merge-commit]
        exclude: '^(CHANGELOG\.md|SECURITY\.md|\.(claude|agents)/skills/(rk-setup|rk-release|sdd-setup|sdd-write-docs)/.+|\.github/workflows/(code-scanning-codeql|pr-title|release-plz|release|scorecard)\.yml|\.release-kit/(manifest|setup-proof)\.json|\.spec-driven-docs/manifest\.json|_docs/\.markdownlint-cli2\.jsonc|_docs/specs/SPEC-(budget-debt|comparison-docs|decision-records|docs-format|docs-foundations|docs-specs|guides|instance|known-issues|spec-to-code|tracking|writing-policy|writing-style)\.md|_docs/specs/SPEC-tracking/tracking\.schema\.json|_docs/(specs|decisions|guides|reference)/TEMPLATE-[a-z-]+\.md)$|(^|/)(Cargo|flake)\.lock$'
      # project: the exclude names every generated file of the list above.
      - id: end-of-file-fixer
        stages: [pre-commit, manual, pre-merge-commit]
        exclude: '^(CHANGELOG\.md|SECURITY\.md|\.(claude|agents)/skills/(rk-setup|rk-release|sdd-setup|sdd-write-docs)/.+|\.github/workflows/(code-scanning-codeql|pr-title|release-plz|release|scorecard)\.yml|\.release-kit/(manifest|setup-proof)\.json|\.spec-driven-docs/manifest\.json|_docs/\.markdownlint-cli2\.jsonc|_docs/specs/SPEC-(budget-debt|comparison-docs|decision-records|docs-format|docs-foundations|docs-specs|guides|instance|known-issues|spec-to-code|tracking|writing-policy|writing-style)\.md|_docs/specs/SPEC-tracking/tracking\.schema\.json|_docs/(specs|decisions|guides|reference)/TEMPLATE-[a-z-]+\.md)$|(^|/)(Cargo|flake)\.lock$'
      # The default `auto` keeps the most frequent ending of a file, so a file
      # that holds only CRLF passes. `--fix=lf` holds every file to LF.
      # project: the exclude names every generated file of the list above.
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: '^(CHANGELOG\.md|SECURITY\.md|\.(claude|agents)/skills/(rk-setup|rk-release|sdd-setup|sdd-write-docs)/.+|\.github/workflows/(code-scanning-codeql|pr-title|release-plz|release|scorecard)\.yml|\.release-kit/(manifest|setup-proof)\.json|\.spec-driven-docs/manifest\.json|_docs/\.markdownlint-cli2\.jsonc|_docs/specs/SPEC-(budget-debt|comparison-docs|decision-records|docs-format|docs-foundations|docs-specs|guides|instance|known-issues|spec-to-code|tracking|writing-policy|writing-style)\.md|_docs/specs/SPEC-tracking/tracking\.schema\.json|_docs/(specs|decisions|guides|reference)/TEMPLATE-[a-z-]+\.md)$|(^|/)(Cargo|flake)\.lock$'
      # project: --maxkb=16384, because tests/cli.rs holds about 2.2 MiB,
      # over the 2048 KiB of the common set.
      - id: check-added-large-files
        args: ['--maxkb=16384']
        stages: [pre-commit, manual, pre-merge-commit]
      - id: check-case-conflict
      # Without the argument the hook passes outside a merge or a rebase, so a
      # marker that a resolved conflict left behind lands unseen.
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: check-symlinks
      - id: destroyed-symlinks
        stages: [pre-commit, manual, pre-merge-commit]
      - id: check-executables-have-shebangs
        stages: [pre-commit, manual, pre-merge-commit]
      - id: check-shebang-scripts-are-executable
        stages: [pre-commit, manual, pre-merge-commit]
      # prek accepts an unknown tag unless it gets --disallow-unknown-tags. The
      # upstream hook refuses one while it loads the file.
      - id: check-yaml
        args: [--disallow-unknown-tags]
      - id: check-toml
      - id: check-xml
      # check-json5 parses JSON with comments and trailing commas, so it does
      # not refuse a commented configuration such as dprint.json or a .jsonc
      # file. `types` resets the filter to every file, and `types_or` selects
      # json, json5, and jsonc. It is the syntax gate only: dprint owns the
      # layout.
      - id: check-json5
        types: [file]
        types_or: [json, json5, jsonc]
      - id: detect-private-key
  # The upstream `language: golang` hook. It checks what no formatter owns:
  # the charset, the line endings, the trailing whitespace, and the indent
  # style.
  #   - -disable-insert-final-newline: end-of-file-fixer owns it.
  #   - -disable-indent-size: each formatter owns the indentation of its files.
  # Markdown is excluded, and .editorconfig-checker.json excludes the
  # generated files.
  - repo: https://github.com/editorconfig-checker/editorconfig-checker
    rev: v4.0.2
    hooks:
      - id: editorconfig-checker
        alias: ec
        args: [-disable-insert-final-newline, -disable-indent-size]
        exclude: '\.md$'
  - repo: local
    hooks:
      # owner: devshell (no-hook-language) upstream dprint publishes no pre-commit hook.
      - id: dprint
        name: dprint check
        # dprint exits 14 rather than passing when it receives only paths its
        # own config excludes, which is what a commit touching just the
        # generated CHANGELOG.md hands it.
        entry: dprint check --allow-no-files
        language: system
        types_or: [markdown, json]
      # A check, not a fix: a hook that rewrites a file leaves the staged copy
      # behind, so `cargo fmt --check` fails and the author formats.
      # owner: devshell (project-environment) cargo fmt is part of the Rust toolchain that the devshell pins.
      - id: cargo-fmt
        name: cargo fmt check
        entry: cargo fmt --check
        language: system
        files: '(\.rs|(^|/)Cargo\.(toml|lock)|^rust-toolchain\.toml)$'
        pass_filenames: false
      # --all-targets lints the tests too, so a lint in a test fails at commit
      # and not first in CI.
      # owner: devshell (project-environment) cargo clippy is part of the Rust toolchain and builds the crate.
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        files: '(\.rs|(^|/)Cargo\.(toml|lock)|^(rust-toolchain|clippy)\.toml)$'
        pass_filenames: false
      # owner: devshell (project-environment) cargo test runs the test suite of the crate.
      # project: the test suite runs here at commit, over the files that the
      # binary embeds, in place of the cargo-nextest hook of the rust set at
      # push. Both would run the same suite twice.
      - id: cargo-test
        name: cargo test
        entry: cargo test
        language: system
        files: '^(src/|tests/|build\.rs$|Cargo\.(toml|lock)$|method/|bindings/|snippets/|blocks/|skills/|versions\.toml$|LICENSE)'
        pass_filenames: false
      # The rk on PATH is the release that flake.nix pins, so the hooks that
      # manage this repository run that release and not a build of the tree.
      # owner: devshell (project-environment) rk must be the release that this project's environment pins.
      - id: the-devshell-rk-is-the-pinned-release
        name: the devshell rk is the pinned release
        entry: sh -c 'tag=$(sed -n "s|^ *url = \"github:gubasso/release-kit/v\([^\"/]*\)\";.*|\1|p" flake.nix | head -n 1); ver=$(rk --version 2>/dev/null | sed -n "s/^rk //p"); [ -n "$tag" ] && [ "$ver" = "$tag" ] || { echo "the rk on PATH (${ver:-none}) is not the release that flake.nix pins (${tag:-no tag}); run the rk of this project through direnv exec ." >&2; exit 1; }'
        language: system
        files: '^(flake\.(nix|lock)|\.envrc)$'
        pass_filenames: false
      # The three checks below are scope `both` at moment push: each is too
      # costly for a commit, so it runs at pre-push, and in the manual sweep
      # that `rk integrate` and `just check` run, which CI invokes too.
      # cargo deny reads the RustSec database that cargo audit reads, and adds
      # the yanked crates, the bans, the sources, and the licenses, so one
      # policy file, deny.toml, owns all four.
      # project: always_run in place of the files of the rust set, because an
      # advisory published after the last change of the lock file fails the
      # next push, not first the CI sweep.
      # owner: devshell (project-environment) cargo deny is a cargo subcommand that reads the lock file of the crate.
      - id: cargo-deny
        name: cargo deny check
        entry: cargo deny check
        language: system
        always_run: true
        stages: [pre-push, manual, pre-merge-commit]
        pass_filenames: false
      # owner: host (no-hook-language) nix comes from the host and has no hook in a language that pre-commit builds.
      - id: nix-flake-check
        name: nix flake check
        entry: nix flake check
        language: system
        always_run: true
        stages: [pre-push, manual, pre-merge-commit]
        pass_filenames: false
      # The scratch landing round trip, through the recipe that owns it.
      # Never make this entry `just check`: that recipe invokes prek
      # and the hook would re-enter itself.
      # owner: devshell (project-environment) the just recipe builds rk and lands it in a scratch target.
      - id: scratch-landing
        name: scratch landing round trip
        entry: just build
        language: system
        always_run: true
        stages: [pre-push, manual, pre-merge-commit]
        pass_filenames: false
      # The two release proofs of the dist-plan job of ci.yml: the committed
      # release.yml is what the pinned dist generates, and dist plan
      # succeeds. The tracked check comes first, because git diff never
      # shows an untracked path, so a deleted workflow would regenerate and
      # diff clean.
      # owner: devshell (project-environment) dist reads the workspace of the crate and generates its workflow.
      - id: dist-plan
        name: dist release proofs
        entry: sh -c 'set -eu; pin=$(grep -m1 "^cargo-dist-version" dist-workspace.toml | cut -d\" -f2); [ -n "$pin" ] || { echo "dist-workspace.toml names no cargo-dist-version" >&2; exit 1; }; dist --version | grep -Fq "$pin" || { echo "the dist on PATH is not the pinned $pin" >&2; exit 1; }; git ls-files --error-unmatch -- .github/workflows/release.yml > /dev/null; dist generate; git diff --exit-code -- .github/workflows/release.yml; dist plan > /dev/null'
        language: system
        always_run: true
        stages: [pre-push, manual, pre-merge-commit]
        pass_filenames: false
  # zizmor and actionlint take their upstream hooks, which prek builds
  # (python and golang). actionlint runs shellcheck from PATH on the `run:`
  # scripts, so the devshell keeps shellcheck for it.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.29.0
    hooks:
      # The snippets are audited against nothing: --no-config keeps zizmor.yml
      # out of reach, because an ignore there is keyed by base filename alone
      # and would silence the shipped release.yml along with the generated
      # one. Every accepted finding in a snippet is an inline comment in that
      # snippet, which renders into each target and drifts no rendered file.
      - id: zizmor
        alias: zizmor-snippets
        name: zizmor over the snippets
        args: [--no-progress, --offline, --no-config, --min-confidence, medium]
        files: '^snippets/.*/\.github/workflows/.*\.ya?ml$'
      - id: zizmor
        alias: zizmor-own
        name: zizmor over this project's workflows
        args: [--no-progress, --offline, --config, zizmor.yml, --min-confidence, medium]
        files: '^\.github/workflows/.*\.ya?ml$'
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      # actionlint reads release.yml too: .github/actionlint.yaml accepts the
      # five shellcheck relays of cargo-dist's output, which are not this
      # project's to fix. See
      # _docs/reference/known-issues/KI-dist-generates-an-unhardened-workflow.md
      - id: actionlint
        files: '^(\.github|snippets/.*/\.github)/workflows/.*\.ya?ml$'
  # md-toc rewrites the list between two `<!--TOC-->` markers, and leaves a
  # file without the markers alone.
  - repo: https://github.com/frnmst/md-toc
    rev: 9.1.0
    hooks:
      # project: `-l, '3'` and the files of the specs, because this project
      # keeps a TOC only in its specs, as the common set describes.
      - id: md-toc
        args: [-p, -c, --skip-lines, '1', github, -l, '3']
        files: '^_docs/specs/SPEC-.*\.md$'
        # The specs sdd ships keep the bytes `sdd spec <name>` prints.
        exclude: '^_docs/specs/SPEC-(budget-debt|comparison-docs|decision-records|docs-format|docs-foundations|docs-specs|guides|instance|known-issues|spec-to-code|tracking|writing-policy|writing-style)\.md$'
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
  - repo: https://github.com/crate-ci/typos
    rev: v1.52.2
    hooks:
      - id: typos
        args: [--force-exclude]
        stages: [pre-commit, manual, pre-merge-commit]
  # Two layers. ripsecrets scans what each commit adds. gitleaks scans the
  # whole history before a push, and passes no file names.
  - repo: https://github.com/sirwart/ripsecrets
    rev: v0.1.11
    hooks:
      - id: ripsecrets
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # project: manual and pre-merge-commit beside pre-push, as for every
      # check that runs at push (the note above cargo-deny).
      - id: gitleaks
        entry: gitleaks git --redact --verbose --no-banner
        pass_filenames: false
        stages: [pre-push, manual, pre-merge-commit]
  - repo: https://github.com/lycheeverse/lychee
    rev: lychee-v0.24.2
    hooks:
      # The devshell supplies the lychee binary, so the hook installs none.
      # local-only: an outside site answers a CI runner with a block or a
      # timeout that it does not give a developer host.
      # owner: devshell (no-hook-language) upstream lychee offers only script, docker_image, and system ids.
      - id: lychee-system
        stages: [pre-push]
        groups: [local-only]
        types: [markdown]
        args: [--no-progress]
  # The upstream `language: python` hook, with its own args
  # (--fixup --wip --commit-file). committed.toml holds the rules. The
  # release-kit block holds the Conventional Commits grammar through
  # conventional-pre-commit, so committed.toml sets `style = "none"` and keeps
  # the line length, the case, and the period at the end of the subject, so
  # two hooks never judge one property.
  - repo: https://github.com/crate-ci/committed
    rev: v1.1.12
    hooks:
      - id: committed
        stages: [commit-msg]
  # Unused dependencies, at push. The upstream `language: rust` hook, which
  # prek builds with the cargo of the devshell.
  - repo: https://github.com/bnjbvr/cargo-machete
    rev: v0.10.1
    hooks:
      # project: manual and pre-merge-commit beside pre-push, as for every
      # check that runs at push.
      - id: cargo-machete
        stages: [pre-push, manual, pre-merge-commit]
  # The one shell script, blocks/post-merge-hook.sh, is a text that rk writes
  # into each clone. shfmt reads its layout from .editorconfig.
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt
        stages: [pre-commit, manual, pre-merge-commit]
  # The Nix hooks. deadnix is the upstream `language: rust` hook.
  - repo: https://github.com/astro/deadnix
    rev: v1.3.2
    hooks:
      # project: the exclude keeps out the snippets, the sources that rk
      # lands into each target. A change there changes every landing, so the
      # tests and the landing verbs judge them, as statix.toml says.
      - id: deadnix
        exclude: '^snippets/'
  - repo: local
    hooks:
      # project: the devshell shellcheck in place of the shellcheck-py hook of
      # the bash set, because actionlint runs that shellcheck on the `run:`
      # scripts of the workflows, so both judge with one version.
      # owner: devshell (outside-caller) actionlint runs the devshell shellcheck, so the hook runs the same one.
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]
      # The flake publishes nixfmt as its `formatter`, and `nix fmt` runs it
      # outside prek, so the hook runs the nixfmt of the same nixpkgs.
      # project: the exclude keeps out the snippets, as for deadnix.
      # owner: devshell (outside-caller) nix fmt runs the nixpkgs nixfmt, so the hook runs the same one.
      - id: nixfmt
        name: nixfmt
        entry: nixfmt
        language: system
        types: [nix]
        exclude: '^snippets/'
      # statix walks the tree itself, so statix.toml holds its scope, and the
      # hook passes no file names.
      # owner: devshell (no-hook-language) statix has no hook in a language that prek builds.
      - id: statix
        name: statix
        entry: statix check
        language: system
        types: [nix]
        pass_filenames: false
  - repo: local
    hooks:
      # A flake holds no language library: a package belongs to the manifest
      # of its stack, and the devshell keeps the toolchain.
      - id: no-language-library-in-flake
        name: a flake holds no language library
        language: pygrep
        entry: '^(?!\s*#).*(withPackages|python3[0-9]*Packages\.|pythonPackages\.|nodePackages\.|perlPackages\.)'
        files: '(^|/)flake\.nix$|(^|/)nix/.*\.nix$'
        stages: [pre-commit, manual, pre-merge-commit]
  # The hooks that exobrain-tech publishes. A flake reference reads the git
  # tree of a checkout, never a path copy of the whole folder into the Nix
  # store. A flake holds no git hook runner. host-requirements.toml parses.
  # The rev of each repository of the named sets follows the tag below, and
  # `exobrain hooks sync` alone moves it.
  - repo: https://github.com/gubasso/exobrain-tech
    rev: v2.0.0
    hooks:
      - id: no-path-flake-reference
      - id: no-hook-runner-in-flake
      # owner: host (host-tool) the hook calls exobrain, which host-requirements.toml lists.
      - id: host-requirements
      # owner: host (host-tool) the hook calls exobrain, which host-requirements.toml lists.
      - id: hook-revisions
        args: [--set, common, --set, rust, --set, bash, --set, nix]
  - repo: meta
    hooks:
      - id: check-useless-excludes
