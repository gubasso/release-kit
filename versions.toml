# The base image of the GitLab rk jobs. The rk archive targets
# x86_64-unknown-linux-gnu, so the image is glibc, never alpine. The version
# is the Debian point release its slim tag names, and digest is the image
# index the pipeline pins. The check reads every page of the Docker Hub tags
# whose name holds a dot, which are the numbered point releases and their slim
# variants, and takes the greatest tag that opens with a version. The full tag
# list runs past the pages Docker Hub serves to an anonymous read.
[[tool]]
name = "debian-image"
version = "13.7"
digest = "sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2"
used_by = ["release.automation/bash", "release.automation/python"]
purpose = "runs the rk jobs of the GitLab release pipeline on glibc"
check = "https://hub.docker.com/v2/namespaces/library/repositories/debian/tags?page_size=100&name=."
checked = 2026-11-12

