[graph]
targets = []
all-features = true

[advisories]
unmaintained = "workspace"
unsound = "workspace"
yanked = "warn"

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "Unicode-3.0",
  "Unlicense",
  # inotify and inotify-sys, dev-only, behind the stage isolation proof.
  "ISC",
]
exceptions = [
  { name = "release-kit", allow = ["CC-BY-4.0"] },
]

[bans]
multiple-versions = "deny"
deny = [{ name = "openssl-sys" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
